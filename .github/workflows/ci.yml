name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # package-lock.json is the lockfile; npm ci fails if it is out of date with package.json.
      - run: npm ci
      # No lint step yet: the repo has no ESLint config or dependency.
      - run: npm run build

